<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delivery Team - PrintLab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f4f6;color:#1a1a1a;padding:32px;}
  .wrap{max-width:900px;margin:0 auto;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  h1{font-size:1.4rem;font-weight:800;}
  .back{background:#1a1a1a;color:#fff;border:none;border-radius:20px;padding:8px 18px;font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;}
  .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead tr{background:#f8f8fa;text-align:left;}
  th,td{padding:12px 16px;border-bottom:1px solid #eee;}
  th{font-weight:700;color:#555;}
  .name{font-weight:700;color:#1a1a1a;}
  .badge{display:inline-block;background:#fff3ea;color:#ea580c;font-weight:700;border-radius:20px;padding:4px 12px;font-size:.8rem;}
  .status{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:12px;display:inline-block;}
  .st-available{background:#e8f8ee;color:#16a34a;}
  .st-busy{background:#fff3ea;color:#ea580c;}
  .st-offline{background:#f0f0f0;color:#888;}
  .empty,.loading,.err{text-align:center;padding:60px 20px;color:#888;}
  .err{color:#dc2626;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Delivery Team</h1>
    <a class="back" href="/shop">&#8592; Back to Shop</a>
  </div>
  <div class="card">
    <div id="content"><div class="loading">Loading&#8230;</div></div>
  </div>
</div>

<script>
const API = window.location.origin;
const tok = localStorage.getItem('pl_s');

function statusClass(s){
  if(s === 'available') return 'st-available';
  if(s === 'busy') return 'st-busy';
  return 'st-offline';
}

async function load(){
  if(!tok){
    document.getElementById('content').innerHTML = '<div class="err">Not logged in. Please log in from the Shop page first.</div>';
    return;
  }
  try{
    const resp = await fetch(API + '/api/v1/delivery-persons/with-order-counts', {
      headers: { 'Authorization': 'Bearer ' + tok }
    });
    if(!resp.ok){
      document.getElementById('content').innerHTML = '<div class="err">Could not load delivery team (status ' + resp.status + ').</div>';
      return;
    }
    const persons = await resp.json();
    if(!persons.length){
      document.getElementById('content').innerHTML = '<div class="empty">No delivery persons added yet.</div>';
      return;
    }
    const rows = persons.map(p => (
      '<tr>' +
        '<td class="name">' + (p.name || '&mdash;') + '</td>' +
        '<td>' + (p.phone || '&mdash;') + '</td>' +
        '<td>' + (p.vehicle_number || '&mdash;') + '</td>' +
        '<td><span class="status ' + statusClass(p.current_status) + '">' + (p.current_status || 'offline') + '</span></td>' +
        '<td><span class="badge">' + (p.order_count || 0) + ' orders</span></td>' +
      '</tr>'
    )).join('');
    document.getElementById('content').innerHTML =
      '<table>' +
        '<thead><tr>' +
          '<th>Name</th><th>Phone</th><th>Vehicle</th><th>Status</th><th>Orders Assigned</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="err">Something went wrong loading the delivery team.</div>';
  }
}

load();
</script>
</body>
</html>
